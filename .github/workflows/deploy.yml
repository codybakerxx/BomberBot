# Puts the game online on Cloudflare every time main changes (docs/ONLINE.md).
# It needs two repository secrets, set once by the owner on GitHub:
#   CLOUDFLARE_API_TOKEN   an API token made from Cloudflare's "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the Account ID shown in the Cloudflare dashboard
# Without them it checks and builds the game, and skips the upload.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check and build
        run: npm run check
      - name: Upload to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets yet: skipping the upload (see docs/ONLINE.md)."
            exit 0
          fi
          npx --yes wrangler@4 deploy
