<title id="t">How a left thumb's quick swipes lean</title>
<desc id="d">Left: the screen's own up, down, left and right. Right: the same four directions as a left thumb really swipes them, turned about 30 degrees clockwise, because the thumb pivots at its base in the bottom-left corner.</desc>
