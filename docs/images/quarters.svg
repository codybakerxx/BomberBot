<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-labelledby="t d">
<title id="t">Why the pad leans its four quarters</title>
<desc id="d">Two circles divided into four quarters for up, down, left and right. In the first the quarters are square to the screen, and a swipe meant as left that leans 40 degrees lands almost on the border with up. In the second the quarters lean 25 degrees clockwise, and the same swipe lands well inside left.</desc>
<rect x="1" y="1" width="678" height="398" rx="14" fill="#0d1019" stroke="#2a3250" stroke-width="2"/>
<text x="170.0" y="42.0" fill="#e8ecff" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">Quarters square to the screen</text>
<path d="M 170 200 L 86.6 116.6 A 118 118 0 0 0 86.6 283.4 Z" fill="#ffc56a" opacity="0.13"/>
<circle cx="170" cy="200" r="118" fill="none" stroke="#2a3250" stroke-width="2"/>
<line x1="170" y1="200" x2="253.4" y2="116.6" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="170" y1="200" x2="86.6" y2="116.6" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="170" y1="200" x2="86.6" y2="283.4" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="170" y1="200" x2="253.4" y2="283.4" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<text x="255.0" y="205.0" fill="#8f9ac0" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">right</text>
<text x="170.0" y="120.0" fill="#8f9ac0" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">up</text>
<text x="89.0" y="237.7" fill="#ffc56a" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">left</text>
<text x="170.0" y="290.0" fill="#8f9ac0" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">down</text>
<line x1="170.0" y1="200.0" x2="65.8" y2="112.6" stroke="#e8ecff" stroke-width="3.5" stroke-linecap="round" opacity="1"/><polygon points="65.8,112.6 76.5,115.3 70.3,122.6" fill="#e8ecff" opacity="1"/>
<circle cx="170" cy="200" r="5" fill="#e8ecff"/>
<text x="170.0" y="352.0" fill="#e8ecff" font-size="14" font-weight="500" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">5° from the border with up</text>
<text x="510.0" y="42.0" fill="#e8ecff" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">Quarters leaned 25°</text>
<path d="M 510 200 L 469.6 89.1 A 118 118 0 0 0 399.1 240.4 Z" fill="#ffc56a" opacity="0.13"/>
<circle cx="510" cy="200" r="118" fill="none" stroke="#2a3250" stroke-width="2"/>
<line x1="510" y1="200" x2="620.9" y2="159.6" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="510" y1="200" x2="469.6" y2="89.1" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="510" y1="200" x2="399.1" y2="240.4" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="510" y1="200" x2="550.4" y2="310.9" stroke="#8f9ac0" stroke-width="2" stroke-dasharray="6 6"/>
<text x="587.0" y="240.9" fill="#8f9ac0" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">right</text>
<text x="545.9" y="128.0" fill="#8f9ac0" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">up</text>
<text x="422.8" y="200.4" fill="#ffc56a" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">left</text>
<text x="474.1" y="282.0" fill="#8f9ac0" font-size="15" font-weight="600" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">down</text>
<line x1="510.0" y1="200.0" x2="405.8" y2="112.6" stroke="#e8ecff" stroke-width="3.5" stroke-linecap="round" opacity="1"/><polygon points="405.8,112.6 416.5,115.3 410.3,122.6" fill="#e8ecff" opacity="1"/>
<circle cx="510" cy="200" r="5" fill="#e8ecff"/>
<text x="510.0" y="352.0" fill="#e8ecff" font-size="14" font-weight="500" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">30° inside left</text>
<text x="340.0" y="384.0" fill="#8f9ac0" font-size="13" font-weight="500" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">White arrow: the same swipe both times, meant as left and leaning 40°.</text>
</svg>
